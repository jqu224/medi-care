<!-- 注释 -->
<g font-size="12" class="m">
 <text x="40" y="962" class="m">· 上半屏只放问候、状态、提醒；点「查看触发依据」展开</text>
 <text x="40" y="982" class="m">· 头像进入档案与设置；没有底部 Tab</text>
 <text x="40" y="1002" class="m">· 红色只用于异常值、发热点和提醒</text>
 <text x="470" y="962" class="m">· 一屏完成，不分步骤；体温可以手输，也可以用加减按钮</text>
 <text x="470" y="982" class="m">· 记录的是实际剂量，医嘱剂量只作对照</text>
 <text x="470" y="1002" class="m">· 全页只有一个主按钮「保存记录」</text>
 <text x="900" y="962" class="m">· 三项指标分开展示，每项都写明来源和日期</text>
 <text x="900" y="982" class="m">· 不写“安全 / 正常”，只陈述变化</text>
 <text x="900" y="1002" class="m">· 导出前一定先预览</text>
</g>
</svg>