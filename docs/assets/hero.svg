<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">MediCare &#8212; rare-disease care workbench</title>
  <desc id="heroDesc">White clinical workbench hero: wordmark, teal-blue-purple divider, and a line-art panel showing a temperature trend crossing its watch line with an explainable alert.</desc>
  <!--
    Hero for dw/multibillion/medi-care &#8212; "clinical chart sheet" persona.
    Family conventions shared with feishu-ai / infographic-slides heroes:
    1200x420 rounded frame, faint grid, mono eyebrow, 800-weight wordmark,
    gradient divider, double-framed BY nameplate, right-side product line-art.
    Palette from DESIGN.md (2026-10-08 white workbench iteration):
      paper #FFFFFF / #F7F9F9   ink #243D35   muted #5D6D69   line #E4E9E8
      teal #146B60 (care)       blue #2463C4 (detection marker)
      purple #8445B4 (event)    amber #B45309 (alert level)
    Encoding note: file is pure ASCII; middle dot / degree / arrow are
    numeric character references so no byte-level encoding can break it.
  -->
  <!--
    No url(#…) paints. GitHub README loads this file through a redirect, and
    browsers drop the whole image when a redirected SVG references a fragment.
  -->
  <g>
    <!-- chart sheet -->
    <rect width="1200" height="420" fill="#F7F9F9"/>
    <path fill="none" stroke="#243D35" stroke-opacity="0.045" stroke-width="1" d="M24 0V420 M48 0V420 M72 0V420 M96 0V420 M120 0V420 M144 0V420 M168 0V420 M192 0V420 M216 0V420 M240 0V420 M264 0V420 M288 0V420 M312 0V420 M336 0V420 M360 0V420 M384 0V420 M408 0V420 M432 0V420 M456 0V420 M480 0V420 M504 0V420 M528 0V420 M552 0V420 M576 0V420 M600 0V420 M624 0V420 M648 0V420 M672 0V420 M696 0V420 M720 0V420 M744 0V420 M768 0V420 M792 0V420 M816 0V420 M840 0V420 M864 0V420 M888 0V420 M912 0V420 M936 0V420 M960 0V420 M984 0V420 M1008 0V420 M1032 0V420 M1056 0V420 M1080 0V420 M1104 0V420 M1128 0V420 M1152 0V420 M1176 0V420 M0 24H1200 M0 48H1200 M0 72H1200 M0 96H1200 M0 120H1200 M0 144H1200 M0 168H1200 M0 192H1200 M0 216H1200 M0 240H1200 M0 264H1200 M0 288H1200 M0 312H1200 M0 336H1200 M0 360H1200 M0 384H1200 M0 408H1200"/>
    <rect x="0.5" y="0.5" width="1199" height="419" rx="21.5" fill="none" stroke="#243D35" stroke-opacity="0.28" stroke-width="1"/>

    <!-- top ruler: ticks every 40, tall every 160 -->
    <g stroke="#243D35" stroke-opacity="0.4" fill="none">
      <line x1="26" y1="12" x2="1174" y2="12" stroke-opacity="0.25"/>
      <path d="M46 8v8 M86 10v4 M126 10v4 M166 10v4 M206 8v8 M246 10v4 M286 10v4 M326 10v4 M366 8v8 M406 10v4 M446 10v4 M486 10v4 M526 8v8 M566 10v4 M606 10v4 M646 10v4 M686 8v8 M726 10v4 M766 10v4 M806 10v4 M846 8v8 M886 10v4 M926 10v4 M966 10v4 M1006 8v8 M1046 10v4 M1086 10v4 M1126 10v4 M1166 8v8"/>
    </g>

    <!-- ============ left: wordmark block ============ -->
    <g transform="translate(0 18)">
      <!-- logo mark: teal chip with pulse -->
      <rect x="64" y="70" width="30" height="30" rx="8" fill="#146B60"/>
      <path d="M69.5 86H75L78 78L82 92L85 83L87.5 86H90.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="106" y="92" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="6" fill="#243D35" fill-opacity="0.62">RARE DISEASE LOG</text>

      <text x="60" y="196" font-family="'Helvetica Neue','Segoe UI',sans-serif" font-size="92" font-weight="800" letter-spacing="-2" fill="#243D35">MediCare</text>
      <rect x="64" y="224" width="186" height="3" rx="1.5" fill="#146B60"/>
      <rect x="250" y="224" width="188" height="3" rx="1.5" fill="#2463C4"/>
      <rect x="438" y="224" width="186" height="3" rx="1.5" fill="#8445B4"/>
      <text x="64" y="258" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#243D35" fill-opacity="0.78">daily log &#183; trend watch &#183; explainable alert</text>

      <!-- double-framed BY nameplate -->
      <g>
        <rect x="64" y="282" width="150" height="30" fill="none" stroke="#243D35" stroke-opacity="0.75" stroke-width="1"/>
        <rect x="67.5" y="285.5" width="143" height="23" fill="none" stroke="#243D35" stroke-opacity="0.45" stroke-width="0.8"/>
        <text x="139" y="302" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" letter-spacing="5" fill="#243D35">BY JQU224</text>
      </g>
    </g>

    <!-- leader connectors tying art to wordmark block -->
    <g stroke="#243D35" stroke-opacity="0.28" stroke-dasharray="2 5">
      <line x1="640" y1="168" x2="688" y2="168"/>
      <line x1="640" y1="330" x2="688" y2="330"/>
    </g>

    <!-- ============ right: line-art of the app ============ -->
    <g stroke-linejoin="round" stroke-linecap="round">
      <rect x="700" y="64" width="436" height="304" rx="16" fill="#FFFFFF" fill-opacity="0.94" stroke="#243D35" stroke-opacity="0.5"/>

      <!-- header: patient + watch state -->
      <circle cx="728" cy="94" r="13" fill="#146B60"/>
      <text x="728" y="98.5" text-anchor="middle" font-family="'SF Pro Text','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Y</text>
      <text x="750" y="90" font-family="'SF Pro Text','Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#243D35">Xiao Yu</text>
      <text x="750" y="106" font-family="'SF Pro Text','Segoe UI',system-ui,sans-serif" font-size="11" fill="#5D6D69">sJIA &#183; week 41</text>
      <rect x="1052" y="82" width="60" height="24" rx="12" fill="#146B60"/>
      <text x="1082" y="98" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="10" letter-spacing="1.5" fill="#FFFFFF">WATCH</text>

      <!-- metric + trend chart card -->
      <rect x="724" y="126" width="388" height="128" rx="12" fill="#FFFFFF" stroke="#E4E9E8"/>
      <text x="740" y="146" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="10" letter-spacing="1.5" fill="#5D6D69">TEMPERATURE</text>
      <text x="740" y="186" font-family="'Helvetica Neue','Segoe UI',sans-serif" font-size="34" font-weight="800" fill="#243D35">37.8</text>
      <text x="820" y="186" font-family="'Helvetica Neue','Segoe UI',sans-serif" font-size="15" font-weight="600" fill="#146B60">&#176;C</text>

      <!-- watch line + crossing trend -->
      <line x1="846" y1="170" x2="1100" y2="170" stroke="#B45309" stroke-opacity="0.8" stroke-width="1.2" stroke-dasharray="4 4"/>
      <text x="852" y="162" text-anchor="start" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="9" fill="#B45309">37.5&#176; watch</text>
      <line x1="846" y1="222" x2="1100" y2="222" stroke="#E4E9E8" stroke-width="1"/>
      <polyline points="852,206 880,202 908,208 936,196 964,188 992,178 1020,164 1048,158 1076,152" fill="none" stroke="#146B60" stroke-width="2.5"/>
      <circle cx="1010" cy="170" r="4" fill="#B45309" stroke="#FFFFFF" stroke-width="1.5"/>
      <circle cx="1076" cy="152" r="3" fill="#146B60"/>

      <!-- marker row: detections (blue dots) + event (purple diamond) -->
      <circle cx="880" cy="236" r="3" fill="#2463C4"/>
      <path d="M922 231 l4.5 5 -4.5 5 -4.5 -5 Z" fill="#8445B4"/>
      <circle cx="964" cy="236" r="3" fill="#2463C4"/>
      <circle cx="1036" cy="236" r="3" fill="#2463C4"/>
      <text x="1100" y="240" text-anchor="end" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="9" fill="#5D6D69">&#9679; det &#9670; evt</text>

      <!-- summary strip -->
      <rect x="724" y="266" width="388" height="32" rx="8" fill="#F7F9F9"/>
      <text x="748" y="287" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11" fill="#243D35">7 logs</text>
      <text x="918" y="287" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11" fill="#243D35">2 over line</text>
      <text x="1088" y="287" text-anchor="end" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11" fill="#243D35">1 alert</text>

      <!-- explainable alert row -->
      <rect x="724" y="310" width="388" height="58" rx="12" fill="#FFFFFF" stroke="#E4E9E8"/>
      <rect x="724" y="310" width="6" height="58" rx="3" fill="#B45309"/>
      <text x="746" y="334" font-family="'SF Pro Text','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" fill="#243D35">Ferritin rising</text>
      <text x="746" y="352" font-family="'SF Pro Text','Segoe UI',system-ui,sans-serif" font-size="11" fill="#5D6D69">6 days over watch line &#183; seek care</text>
      <text x="1088" y="341" text-anchor="end" font-family="'SF Pro Text','Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" fill="#146B60">why &#8594;</text>
    </g>
  </g>
</svg>
